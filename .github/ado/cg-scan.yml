# Prototype for ADO Feature 84645, phase 0b: a thin per-repository file. Everything except triggers lives in
# the osdu-spi template, consumed at a pinned tag. Lives only on branch proto/cg-scan.

trigger:
  branches:
    include:
      - proto/cg-scan
  tags:
    include:
      - cgproto-*

pr: none

schedules:
  - cron: '0 6 * * 1'
    displayName: Weekly
    branches:
      include:
        - proto/cg-scan
    always: true

resources:
  repositories:
    - repository: osdu_spi
      type: github
      endpoint: github.com_yuchen-osdu
      name: yuchen-osdu/osdu-spi
      ref: refs/tags/cgproto-template-7

extends:
  template: ado/cg-scan.yml@osdu_spi
  parameters:
    scanType: Register
    mavenProfiles: core,azure
    shippedModules: provider/search-azure
    upstreamUrl: https://community.opengroup.org/osdu/platform/system/search-service.git
    # This fork predates the upstream filter (no Upstream-Sha trailers); fork_upstream tip at initialization.
    upstreamBaseline: 2788ce13b1b5e3a8b9af9ece99086318bcc9d6ef
    images: ghcr.io/yuchen-osdu/search@sha256:30a1aa40983a92749149afc5af78ac4d9ab8acebed3f3b96484d33a92263c0d1
    # Phase 0d: open a NOTICE PR into the prototype branch, never main.
    noticePrBase: proto/cg-scan
