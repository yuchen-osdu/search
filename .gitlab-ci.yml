download_plugins:
  image: maven:3.8.3-openjdk-17-slim
  stage: build
  variables:
    APD_PACKAGE_REGISTRY_URL: "https://community.opengroup.org/api/v4/projects/1445/packages/maven"
    APD_VERSION: "0.26.0"

  artifacts:
    paths:
      - ./tmp/*.jar
    when: always
    expire_in: 1 days

  script:
    - mvn dependency:copy -DrepoUrl=$APD_PACKAGE_REGISTRY_URL -Dartifact="org.opengroup.osdu:apd-openid:$APD_VERSION:jar:plugin" -Dtransitive=false -DoutputDirectory="./tmp"

  only:
    variables:
      - $PROTECTED == '1'


aws-test-java:
  image: $CI_REGISTRY/osdu/platform/deployment-and-operations/base-containers-aws/aws-maven/aws-maven:v2.0

schemathesis-tests:
  stage: acceptance
  image: python:3.12.12-slim
  needs: 
  - cimpl-deploy
  extends: .cimpl-variables
  variables:
    ALLURE_VERSION: "2.40.0"
    KEYCLOAK_ENDPOINT: ${TEST_OPENID_PROVIDER_URL}/protocol/openid-connect/token
    CLIENT_ID: ${TEST_OPENID_PROVIDER_CLIENT_ID}
    CLIENT_SECRET: ${TEST_OPENID_PROVIDER_CLIENT_SECRET}
  before_script:
    - apt-get update
    - apt-get install -y --no-install-recommends curl default-jre-headless
    - rm -rf /var/lib/apt/lists/*
    - pip install --no-cache-dir uv
    - curl -sSL "https://repo.maven.apache.org/maven2/io/qameta/allure/allure-commandline/${ALLURE_VERSION}/allure-commandline-${ALLURE_VERSION}.tgz" | tar -xz -C /tmp
    - export PATH="/tmp/allure-${ALLURE_VERSION}/bin:${PATH}"
  script:
    - cd schemathesis-tests
    - |
      SCHEMA_LOCATION="https://osdu.${CIMPL_DOMAIN}${CIMPL_OPENAPI_YAML_ROUTE}"
      echo "KEYCLOAK_ENDPOINT: $KEYCLOAK_ENDPOINT"
      echo "CLIENT_ID is set: ${CLIENT_ID:+yes}"
      echo "CLIENT_SECRET is set: ${CLIENT_SECRET:+yes}"
      echo "Schema location: $SCHEMA_LOCATION"

      TEST_EXIT_CODE=0

      uv run run_schemathesis.py "$SCHEMA_LOCATION" || TEST_EXIT_CODE=$?

      allure generate --single-file output/allure/results -o output/report --clean || echo "Allure report generation failed"

      exit "$TEST_EXIT_CODE"
  artifacts:
    when: always
    expose_as: "Allure Report"
    reports:
      junit: schemathesis-tests/output/junit/junit.xml
    paths:
      - schemathesis-tests/output/report/index.html
  only:
    variables:
      - $PROTECTED == '1'
