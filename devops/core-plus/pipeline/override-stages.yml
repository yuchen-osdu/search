variables:
  CIMPL_SERVICE: "search"
  CIMPL_TESTING_DIR: "testing"
  CIMPL_BUILD_PATH: "search-core-plus/cloudbuild/Dockerfile"
  DISABLE_INTEGRATION_TEST: true

cimpl-acceptance-test:
  variables:
    DEFAULT_DATA_PARTITION_ID_TENANT2: non-exist
    CUCUMBER_OPTIONS: "@default or @health or @SpatialLongitudeStandardRange"

#dev2 jobs

cimpl-dev2-acceptance-test:
  variables:
    DEFAULT_DATA_PARTITION_ID_TENANT2: non-exist
    CUCUMBER_OPTIONS: "@default or @health or @SpatialLongitudeStandardRange"

#standby (Blue-Green) jobs

cimpl-standby-acceptance-test:
  variables:
    DEFAULT_DATA_PARTITION_ID_TENANT2: non-exist
    CUCUMBER_OPTIONS: "@default or @health or @SpatialLongitudeStandardRange"
